[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nidl-benchmarks"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Antoine Grigis", email = "antoine.grigis@cea.fr"},
    {name = "Benoit Dufumier", email="benoit.dufumier@cea.fr"},
]
license = {text = "CECILL-B"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "nidl",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "huggingface-hub>=0.23",
    "scipy>=1.11",
]
dynamic = ["version"]

[project.optional-dependencies]
slurm = [
    "hydra-submitit-launcher>=1.2",
]

[project.urls]
Source = "https://github.com/neurospin-deepinsight/nidl"
Tracker = "https://github.com/neurospin-deepinsight/nidl/issues"

[tool.setuptools]
platforms = ["Linux", "OSX"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "benchmarks.__version__"}

[tool.setuptools.packages.find]
namespaces = false

[tool.ruff.lint]
preview = true
extend-select = [
    "E225", # missing whitespace around operator
    "E261", # at least two spaces before inline comment
    "E222", # multiple spaces after operator
    "W291", # trailing whitespace
    "E501", # `line-too-long` rule
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "SIM",  # flake8-simplify
    "FLY",  # flynt
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",
]
ignore = [
    "RUF052",   # Local dummy variable `_*` is accessed
    "FURB101",  # `open` and `read` should be replaced by `Path(path).read_text()`
    "FURB103",  # `open` and `write` should be replaced by `Path(logfile).write_text(code)`
    "FURB189",  # Subclassing `dict` can be error prone, use `collections.UserDict` instead
    "N803",     # Argument name should be lowercase
    "N806",     # Variable in function should be lowercase
    "D100",    # Missing docstring in public module
    "D102",    # Missing docstring in public method
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "D205",    # 1 blank line required between summary line and description
    "UP007",   # Use `X | Y` for type annotations (only for python > 3.10)
    "UP045",   # Use `X | None` for type annotations (only for python > 3.10)
    "RET504",  # Unnecessary assignment before `return` statement
    "EXE002",  # File is executable but does not contain a shebang
    "FURB140", # Use itertools.starmap instead of a generator inside all
]

[tool.ruff]
line-length = 79
target-version = "py39"
extend-exclude = [
    "tests",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "warnings",
    "pass",
    "raise NotImplementedError",
]
omit = [
    "benchmarks/info.py",
]